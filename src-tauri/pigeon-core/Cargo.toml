[package]
name = "pigeon-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
url = "2.5"
reqwest = { version = "0.12", features = ["json", "multipart"] }
tokio = { version = "1", features = ["full"] }
keyring = "3.6.3"
base64 = "0.22.1"
csv = "1.4.0"
rquickjs = { version = "0.14.0", features = ["classes", "macro"] }
tower = "0.5.3"
